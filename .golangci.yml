version: "2"
run:
  timeout: 5m
  build-tags:
    - test_unit
    - test_integration
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gocritic:
      disabled-checks:
        - commentFormatting
    revive:
      rules:
        - name: errorf
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: comment on
      - path: (.+)\.go$
        text: error should be the last
      - path: _test\.go
        linters:
          - goconst
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/iguazio/orca)
        - default
        - blank
        - dot
      custom-order: true
